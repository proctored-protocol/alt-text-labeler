services:
  postgres:
    image: postgres:17
    container_name: alt-labeler-postgres
    environment:
      POSTGRES_DB: alt_labeler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alt_labeler"]
      interval: 10s
      timeout: 5s
      retries: 5